---
name: Build/Publish

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout the code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7.2.3
      with:
        version: v2.18.2
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
