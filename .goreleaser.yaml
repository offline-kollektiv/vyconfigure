version: 2

project_name: vyconfigure

env:
  - GO111MODULE=on

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - -s -w -X 'github.com/offline-kollektiv/vyconfigure/cmd.Version={{.Version}}' -X 'github.com/offline-kollektiv/vyconfigure/cmd.Commit={{.ShortCommit}}' -X 'github.com/offline-kollektiv/vyconfigure/cmd.Date={{.Date}}'
    binary: vyconfigure

release:
  prerelease: auto

archives:
  - formats: [ 'binary' ]
